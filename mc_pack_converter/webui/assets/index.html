<!doctype html>
<meta charset="utf-8">
<title>MC Pack Converter</title>
<style>{css}</style>
<body>
  <header>
    <h1 id="headline">MC Pack Converter</h1>
    <div id="details"></div>
  </header>

  <div id="update" class="muted" hidden></div>

  <nav id="tabs">
    <button data-view="findings" class="on">Findings</button>
    <button data-view="textures">Textures</button>
    <span class="spacer"></span>
    <span id="out-name" class="muted"></span>
  </nav>

  <main>
    <section id="findings"></section>
    <section id="textures" hidden></section>
  </main>

  <div id="lightbox" hidden><img id="lightbox-img" alt=""></div>
  <script>window.MODEL = {model};</script>
  <script>{js}</script>
</body>
