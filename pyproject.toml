[project]
name = "mc-pack-converter"
version = "0.1.0"
requires-python = ">=3.11"
# numpy: sky.py ray-traces one ray per output pixel into the sky cube --
# 64k rays at preview size -- in a single vectorised pass. It was imported
# from the day that renderer was written and declared here only after a
# bare CI runner proved a clean install could not build a QA sheet.
dependencies = ["Pillow>=10.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mc-pack-converter = "mc_pack_converter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["mc_pack_converter*"]

[tool.setuptools.package-data]
mc_pack_converter = ["data/*.json", "webui/assets/*"]
