name: release

on:
  push:
    tags: ["v*"]
    branches: ["feature/windows-exe"]  # TEMPORARY: proves the build pre-merge
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,build]"
      # The GUI's tkinter import is deliberately guarded, so its absence would
      # otherwise pass tests and still produce an exe that opens nothing.
      - run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"
      - run: pytest -q
      - run: pyinstaller packaging/mcpc.spec
      # Always published as an artifact, so a workflow_dispatch run produces a
      # binary to smoke-test BEFORE any tag is cut.
      - uses: actions/upload-artifact@v4
        with:
          name: MCPackConverter-exe
          path: dist/MCPackConverter.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/MCPackConverter.exe
