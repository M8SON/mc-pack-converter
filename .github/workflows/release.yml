name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ".[dev,build,gui]"
      # Both imports are guarded at runtime, so their absence would otherwise
      # pass tests and still produce an exe that opens nothing.
      - run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"
      # The import is the assertion; the version comes from package metadata
      # because pywebview exposes no __version__ attribute.
      - run: python -c "import webview, importlib.metadata as m; print('pywebview', m.version('pywebview'))"
      - run: pytest -q
      - run: pyinstaller packaging/mcpc.spec
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyinstaller-warnings
          path: build/mcpc/warn-mcpc.txt
      - name: Verify the exe actually contains the GUI
        shell: bash
        run: |
          set -e
          strings_of() { python -c "
          import re,sys
          d=open(sys.argv[1],'rb').read()
          print('\n'.join(m.decode('latin1') for m in re.findall(rb'[ -~]{6,}', d)))
          " "$1"; }
          strings_of dist/MCPackConverter.exe > /tmp/s.txt
          # calibrate: a file we KNOW is bundled must be visible
          grep -q "pack_format.json" /tmp/s.txt || { echo "CALIBRATION FAILED"; exit 1; }
          # a name we know is absent must NOT be visible
          grep -q "definitely_not_bundled_xyzzy" /tmp/s.txt && { echo "CALIBRATION FAILED"; exit 1; }
          for needle in "webui" "index.html" "app.js" "edgechromium"; do
            grep -q "$needle" /tmp/s.txt || { echo "MISSING: $needle"; exit 1; }
          done
          ls -l dist/MCPackConverter.exe
      # Always published as an artifact, so a workflow_dispatch run produces a
      # binary to smoke-test BEFORE any tag is cut.
      - uses: actions/upload-artifact@v4
        with:
          name: MCPackConverter-exe
          path: dist/MCPackConverter.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
        with:
          files: dist/MCPackConverter.exe
